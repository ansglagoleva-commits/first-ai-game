<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Plane</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1b1b2f;
    color: #fff;
    font-family: "Courier New", monospace;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    position: relative;
    width: 320px;
    height: 480px;
    border: 4px solid #e0e0e0;
    box-shadow: 0 0 0 4px #000;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #score {
    position: absolute;
    top: 8px;
    left: 10px;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 2px 2px 0 #000;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(0, 0, 0, 0.6);
    text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay h1 {
    margin: 0;
    font-size: 36px;
    color: #ff4d4d;
    text-shadow: 3px 3px 0 #000;
  }
  #overlay p { margin: 0; font-size: 16px; }
  #restart {
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background: #ff4d4d;
    border: 3px solid #000;
    box-shadow: 3px 3px 0 #000;
    padding: 8px 16px;
    cursor: pointer;
  }
  #restart:hover { background: #ff6b6b; }
  #restart:active {
    transform: translate(3px, 3px);
    box-shadow: none;
  }
  #hint {
    position: absolute;
    bottom: -32px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    color: #aaa;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="160" height="240"></canvas>
  <div id="score">Счёт: 0</div>
  <div id="overlay">
    <h1>Game Over</h1>
    <p id="final">Счёт: 0</p>
    <button id="restart" type="button">Играть снова</button>
  </div>
  <div id="hint">← → — управление</div>
</div>

<script>
  // Игра рисуется на маленьком холсте 160x240 и растягивается в 2 раза — отсюда пиксельность.
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  const scoreEl = document.getElementById('score');
  const overlay = document.getElementById('overlay');
  const finalEl = document.getElementById('final');
  const restartBtn = document.getElementById('restart');

  // Пиксельный спрайт самолётика (каждый символ = 1 пиксель).
  const PLANE_SPRITE = [
    '....R....',
    '...RWR...',
    '...RWR...',
    '.RRRRRRR.',
    'RRRRRRRRR',
    '...RRR...',
    '...RRR...',
    '..RRRRR..',
  ];
  // Пиксельный спрайт препятствия (камень).
  const ROCK_SPRITE = [
    '..GGGG..',
    '.GGLGGG.',
    'GGLGGGGG',
    'GGGGGDGG',
    'GGGGGDGG',
    'GDGGGGGG',
    '.GGGGGG.',
    '..GGGG..',
  ];
  const COLORS = {
    R: '#ff4d4d',
    W: '#9fe8ff',
    G: '#8a8a9a',
    L: '#c0c0cc',
    D: '#5a5a6a',
  };

  function drawSprite(sprite, x, y) {
    for (let row = 0; row < sprite.length; row++) {
      for (let col = 0; col < sprite[row].length; col++) {
        const c = sprite[row][col];
        if (c !== '.') {
          ctx.fillStyle = COLORS[c];
          ctx.fillRect(Math.round(x) + col, Math.round(y) + row, 1, 1);
        }
      }
    }
  }

  const PLANE_W = PLANE_SPRITE[0].length;
  const PLANE_H = PLANE_SPRITE.length;
  const ROCK_W = ROCK_SPRITE[0].length;
  const ROCK_H = ROCK_SPRITE.length;

  let plane, rocks, stars, score, spawnTimer, speed, running, lastTime;
  const keys = { left: false, right: false };

  function reset() {
    plane = { x: (W - PLANE_W) / 2, y: H - PLANE_H - 8, speed: 90 };
    rocks = [];
    stars = Array.from({ length: 30 }, () => ({
      x: Math.floor(Math.random() * W),
      y: Math.random() * H,
      s: 10 + Math.random() * 30,
    }));
    score = 0;
    spawnTimer = 0;
    speed = 50;
    running = true;
    scoreEl.textContent = 'Счёт: 0';
    overlay.classList.remove('show');
    lastTime = performance.now();
  }

  function spawnRock() {
    rocks.push({
      x: Math.floor(Math.random() * (W - ROCK_W)),
      y: -ROCK_H,
      vy: speed + Math.random() * 20,
    });
  }

  // Столкновение по прямоугольникам, чуть уменьшенным, чтобы было честнее.
  function hit(a, b) {
    const m = 1;
    return a.x + m < b.x + ROCK_W - m &&
           a.x + PLANE_W - m > b.x + m &&
           a.y + m < b.y + ROCK_H - m &&
           a.y + PLANE_H - m > b.y + m;
  }

  function update(dt) {
    // Звёзды на фоне
    for (const s of stars) {
      s.y += s.s * dt;
      if (s.y > H) { s.y = 0; s.x = Math.floor(Math.random() * W); }
    }

    if (!running) return;

    // Движение самолёта
    if (keys.left) plane.x -= plane.speed * dt;
    if (keys.right) plane.x += plane.speed * dt;
    plane.x = Math.max(0, Math.min(W - PLANE_W, plane.x));

    // Постепенное усложнение
    speed += dt * 2;

    // Появление препятствий
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnRock();
      spawnTimer = Math.max(0.35, 1.0 - score * 0.01);
    }

    // Движение препятствий, счёт и проверка столкновений
    for (let i = rocks.length - 1; i >= 0; i--) {
      const r = rocks[i];
      r.y += r.vy * dt;
      if (hit(plane, r)) {
        gameOver();
        return;
      }
      if (r.y > H) {
        rocks.splice(i, 1);
        score++;
        scoreEl.textContent = 'Счёт: ' + score;
      }
    }
  }

  function draw() {
    ctx.fillStyle = '#0d0d26';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ffffff';
    for (const s of stars) ctx.fillRect(s.x, Math.floor(s.y), 1, 1);

    for (const r of rocks) drawSprite(ROCK_SPRITE, r.x, r.y);
    drawSprite(PLANE_SPRITE, plane.x, plane.y);
  }

  function gameOver() {
    running = false;
    finalEl.textContent = 'Счёт: ' + score;
    overlay.classList.add('show');
    restartBtn.focus();
  }

  // Перезапуск: сбрасываем состояние и отпускаем «залипшие» клавиши.
  function restart() {
    keys.left = false;
    keys.right = false;
    reset();
    restartBtn.blur();
  }

  restartBtn.addEventListener('click', restart);

  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
    if (e.key === 'ArrowRight') { keys.right = true; e.preventDefault(); }
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
  });

  reset();
  requestAnimationFrame(loop);
</script>
</body>
</html>
